# Runs on every pull request. Nothing merges into develop or main unless this
# is green. Deploys re-run the same gate — see deploy.yml.

name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, analyse, test
    runs-on: ubuntu-latest
    # The template .env names the cPanel database user; the runner's MySQL
    # service is root with no password. Real environment variables win over
    # .env, so this is all it takes.
    env:
      DB_USERNAME: root
      DB_PASSWORD: ''
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: scghf_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_mysql, sodium, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Composer's post-autoload-dump hook runs `php artisan package:discover`,
      # which boots the application. With no .env, APP_ENV defaults to
      # `production`, and PaymentServiceProvider refuses to boot production on
      # the fake payment driver — correctly. So the template .env (APP_ENV=local)
      # must exist BEFORE Composer runs. It never reaches the server: the release
      # tree excludes .env, and the server has its own in shared/.
      - name: Create the template .env before Composer boots the app
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          echo "DB_HOST=127.0.0.1"        >> .env
          echo "DB_PORT=3306"             >> .env
          echo "DB_DATABASE=scghf_test"   >> .env
          echo "DB_USERNAME=root"         >> .env
          echo "DB_PASSWORD="             >> .env

      - name: Check code style
        run: vendor/bin/pint --test

      # Larastan, level 5, against a baseline taken in Phase 14. A new error
      # fails the build; an old one stays in the baseline until somebody fixes
      # it. The baseline count should only go down.
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Known vulnerabilities in what we ship. Dependabot proposes the fix;
      # this is what stops a deploy going out before the fix is merged.
      - name: Audit PHP dependencies
        run: composer audit --no-dev --locked

      - name: Run migrations against a real MySQL
        run: php artisan migrate --force --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # Built BEFORE the tests: every layout calls @vite, and without
      # public/build/manifest.json every page is a 500 — the accessibility
      # sweep and every page test would fail for a reason that has nothing
      # to do with the code under test. The browser suite runs in its own
      # job below; it needs Chromium as well.
      - name: Run tests
        run: php artisan test --exclude-testsuite Browser

      - name: Audit JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      # A 3G-first site cannot afford unbounded bundles. These numbers are the
      # Phase 1 performance budget; raising them is a deliberate decision, not
      # something that happens by accident.
      - name: Enforce the asset budget
        run: |
          set -euo pipefail
          JS_BYTES=$(find public/build -name '*.js'  -exec cat {} + 2>/dev/null | gzip -9 -c | wc -c || echo 0)
          CSS_BYTES=$(find public/build -name '*.css' -exec cat {} + 2>/dev/null | gzip -9 -c | wc -c || echo 0)
          JS_KB=$((JS_BYTES / 1024)); CSS_KB=$((CSS_BYTES / 1024))
          echo "JS  (gzipped): ${JS_KB} KB  — budget 100 KB"
          echo "CSS (gzipped): ${CSS_KB} KB — budget  50 KB"
          FAILED=0
          [ "$JS_KB"  -gt 100 ] && { echo "::error::JS bundle is ${JS_KB} KB gzipped, over the 100 KB budget."; FAILED=1; } || true
          [ "$CSS_KB" -gt 50  ] && { echo "::error::CSS bundle is ${CSS_KB} KB gzipped, over the 50 KB budget."; FAILED=1; } || true
          exit $FAILED

      - name: Check for secrets
        run: |
          set -euo pipefail
          if git grep -nIE 'sk_live_[0-9a-zA-Z]{20,}|pk_live_[0-9a-zA-Z]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- . ':!*.md' ':!.github/workflows/*'; then
            echo "::error::A live key or private key is present in tracked files."
            exit 1
          fi
          echo "Clean."

  # ── Coverage ──────────────────────────────────────────────────────────────
  # The same suite once more, under pcov, with a floor. Kept apart from the
  # gate above so a slow coverage run never delays the answer to "did the
  # tests pass", and so the report is an artifact rather than log noise.
  # The floor is raised, never lowered, as the number climbs; see
  # docs/PHASE-14-QA.md §4 for the reasoning behind the first value.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # The template .env names the cPanel database user; the runner's MySQL
    # service is root with no password. Real environment variables win over
    # .env, so this is all it takes.
    env:
      DB_USERNAME: root
      DB_PASSWORD: ''
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: scghf_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_mysql, sodium, tokenizer, xml, zip
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Composer's post-autoload-dump hook runs `php artisan package:discover`,
      # which boots the application. With no .env, APP_ENV defaults to
      # `production`, and PaymentServiceProvider refuses to boot production on
      # the fake payment driver — correctly. So the template .env (APP_ENV=local)
      # must exist BEFORE Composer runs. It never reaches the server: the release
      # tree excludes .env, and the server has its own in shared/.
      - name: Create the template .env before Composer boots the app
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          echo "DB_HOST=127.0.0.1"        >> .env
          echo "DB_PORT=3306"             >> .env
          echo "DB_DATABASE=scghf_test"   >> .env
          echo "DB_USERNAME=root"         >> .env
          echo "DB_PASSWORD="             >> .env
          php artisan migrate --force --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets (every layout calls @vite)
        run: |
          npm ci
          npm run build

      - name: Run tests with coverage
        run: |
          php artisan test --exclude-testsuite Browser             --coverage --min=${{ vars.COVERAGE_MIN || 60 }}             --coverage-clover=storage/coverage/clover.xml             --coverage-html=storage/coverage/html

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: storage/coverage
          retention-days: 14

  # ── Browser ───────────────────────────────────────────────────────────────
  # Chromium through Playwright, against the app served in-process by
  # pest-plugin-browser: a donation, a purchase, the theme, the keyboard, and
  # every public form. Needs the built assets, so Node comes first here.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # The template .env names the cPanel database user; the runner's MySQL
    # service is root with no password. Real environment variables win over
    # .env, so this is all it takes.
    env:
      DB_USERNAME: root
      DB_PASSWORD: ''
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: scghf_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_mysql, sockets, sodium, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Composer's post-autoload-dump hook runs `php artisan package:discover`,
      # which boots the application. With no .env, APP_ENV defaults to
      # `production`, and PaymentServiceProvider refuses to boot production on
      # the fake payment driver — correctly. So the template .env (APP_ENV=local)
      # must exist BEFORE Composer runs. It never reaches the server: the release
      # tree excludes .env, and the server has its own in shared/.
      - name: Create the template .env before Composer boots the app
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets and install Chromium
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          echo "DB_HOST=127.0.0.1"        >> .env
          echo "DB_PORT=3306"             >> .env
          echo "DB_DATABASE=scghf_test"   >> .env
          echo "DB_USERNAME=root"         >> .env
          echo "DB_PASSWORD="             >> .env
          php artisan migrate --force --no-interaction

      - name: Run browser tests
        run: php artisan test --testsuite Browser

      - name: Keep the screenshots of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
          retention-days: 7
